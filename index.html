<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SB | Your Style. Your Everyday.</title>
    <meta name="description" content="SB is your urban streetwear and lifestyle one-stop store in Blantyre, Malawi. Shop clothing, footwear, accessories, and everyday style essentials." />
    <meta name="author" content="SB" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" data-brand-icon="sb" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" data-brand-icon="sb" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" data-brand-icon="sb" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" data-brand-icon="sb" />
    <link rel="manifest" href="/site.webmanifest" data-brand-icon="sb" />
    <meta name="theme-color" content="#0a0a0a" />

    <!--
      Brand bootstrap, runs before the body paints so the correct brand,
      title, favicon and loading splash are in place on first paint.
      Resolution mirrors src/lib/brandSite.ts: env → hostname → localhost → SB.
    -->
    <script>
      (function () {
        try {
          var forced = (window.__BRAND_SITE__ || "").toString().toLowerCase();
          var host = (window.location.hostname || "").toLowerCase();
          var path = window.location.pathname || "/";
          var isLocal = host === "localhost" || host === "127.0.0.1" || host === "::1" || host === "" || /\.local$/.test(host);

          var isLF;
          var isDual;
          if (forced === "lf" || forced === "lake-fresh" || forced === "lakefresh") {
            isLF = true;
            isDual = false;
          } else if (forced === "sb" || forced === "streetwear") {
            isLF = false;
            isDual = false;
          } else if (forced === "dual") {
            isLF = false;
            isDual = true;
          } else {
            isLF = host.indexOf("lakefresh") !== -1;
            isDual = !isLF && isLocal;
          }

          var lfContext = isLF || (isDual && (path === "/lf" || path.indexOf("/lf/") === 0));

          document.documentElement.setAttribute("data-site", isLF ? "lf" : isDual ? "dual" : "sb");
          document.documentElement.setAttribute("data-brand", lfContext ? "lf" : "sb");

          if (lfContext) {
            document.title = "Lake Fresh Fish Mart | Fresh Fish for Your Table";

            var desc = document.querySelector("meta[name='description']");
            if (desc) {
              desc.setAttribute(
                "content",
                "Lake Fresh Fish Delivered to your door. Chambo, Micheni and Usipa, cleaned and cut, with one free recipe. Order by 8 PM for delivery tomorrow."
              );
            }

            var head = document.head;
            var stale = head.querySelectorAll("link[rel*='icon'], link[rel='manifest']");
            for (var i = 0; i < stale.length; i++) stale[i].parentNode.removeChild(stale[i]);

            var addLink = function (rel, href, sizes, type) {
              var el = document.createElement("link");
              el.setAttribute("rel", rel);
              el.setAttribute("href", href);
              if (sizes) el.setAttribute("sizes", sizes);
              if (type) el.setAttribute("type", type);
              el.setAttribute("data-brand-icon", "lf");
              head.appendChild(el);
            };
            addLink("icon", "/brand/lake-fresh/icon.png", null, "image/png");
            addLink("apple-touch-icon", "/brand/lake-fresh/icon.png", "180x180", "image/png");
            addLink("manifest", "/brand/lake-fresh/site.webmanifest", null, null);

            var theme = document.querySelector("meta[name='theme-color']");
            if (!theme) {
              theme = document.createElement("meta");
              theme.setAttribute("name", "theme-color");
              head.appendChild(theme);
            }
            theme.setAttribute("content", "#073B78");

            // Open Graph and Twitter cards must match Lake Fresh before share
            // crawlers see the default SB tags.
            var setMeta = function (attr, key, value) {
              var el = document.querySelector("meta[" + attr + "='" + key + "']");
              if (!el) {
                el = document.createElement("meta");
                el.setAttribute(attr, key);
                head.appendChild(el);
              }
              el.setAttribute("content", value);
              el.setAttribute("data-brand-og", "lf");
            };
            var lfTitle = "Lake Fresh Fish Mart | Fresh Fish for Your Table";
            var lfDesc =
              "Lake Fresh Fish Delivered to your door. Chambo, Micheni and Usipa, cleaned and cut, with one free recipe. Order by 8 PM for delivery tomorrow.";
            var lfImage = "/brand/lake-fresh/logo.png";
            setMeta("property", "og:title", lfTitle);
            setMeta("property", "og:description", lfDesc);
            setMeta("property", "og:site_name", "Lake Fresh Fish Mart");
            setMeta("property", "og:image", lfImage);
            setMeta("property", "og:type", "website");
            setMeta("name", "twitter:title", lfTitle);
            setMeta("name", "twitter:description", lfDesc);
            setMeta("name", "twitter:image", lfImage);
            setMeta("name", "author", "Lake Fresh Fish Mart");
          }
        } catch (e) {
          /* Never block rendering on brand bootstrap. */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Critical inline CSS - prevents white flash -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* Lake Fresh loading surface */
      html[data-brand="lf"] body {
        background-color: #EAF6FB;
      }
      /* Loading screen while React loads, shows the active brand's logo, never a cross-brand mark */
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #0a0a0a;
        gap: 16px;
      }
      #root:empty::before {
        content: '';
        width: 64px;
        height: 64px;
        background-image: url('/streetwear-blantyre-logo.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        animation: pulse 1.5s ease-in-out infinite;
      }
      html[data-brand="lf"] #root:empty {
        background-color: #EAF6FB;
      }
      html[data-brand="lf"] #root:empty::before {
        content: '';
        width: 156px;
        height: 96px;
        background-image: url('/brand/lake-fresh/icon.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>

    <meta property="og:title" content="SB | Your Style. Your Everyday." />
    <meta property="og:description" content="Everything your everyday style needs, in one place. Shop urban streetwear and lifestyle essentials from SB in Blantyre, Malawi." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/sb/home-menu.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/images/sb/home-menu.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
