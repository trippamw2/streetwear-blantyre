<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streetwear Blantyre - Wear the Culture</title>
    <meta name="description" content="Streetwear Blantyre - Streetwear fashion for the culture. T-shirts, hoodies, caps, sneakers. Order via WhatsApp in Malawi." />
    <meta name="author" content="Streetwear Blantyre" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Critical inline CSS - prevents white flash -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      /* Loading screen while React loads — shows logo instead of spinner */
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #0a0a0a;
        gap: 16px;
      }
      #root:empty::before {
        content: '';
        width: 64px;
        height: 64px;
        background-image: url('/streetwear-blantyre-logo.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1); }
      }
    </style>

    <meta property="og:title" content="Streetwear Blantyre - Wear the Culture" />
    <meta property="og:description" content="Streetwear fashion for the culture. From campus to the streets, never miss a fit." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/streetwear-blantyre-logo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/streetwear-blantyre-logo.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
